name: PM Assistant IQ Android

# Builds the PM Assistant IQ by PontiMax Android bundle (.aab) from pontimax-assistant/app.
# The bundle is built UNSIGNED and pushed with a test APK to the pmiq-android-builds branch.
# It is signed with the PM Assistant IQ upload key (kept in the PontiMax project files, never in git)
# before it goes to Play Console.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pontimax-assistant/app/**', .github/workflows/pmiq-android.yml]

permissions:
  contents: write

concurrency:
  group: pmiq-android
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Make the Android project
        working-directory: pontimax-assistant/app
        run: |
          npm ci
          npx cap add android
          npm run assets -- --android
          npx cap sync android
      - name: Set version
        working-directory: pontimax-assistant/app/android
        run: |
          NAME=$(node -p "require('../package.json').version")
          CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$NAME\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          echo "VERSION_LABEL=$NAME-$CODE" >> "$GITHUB_ENV"
      - name: Build
        working-directory: pontimax-assistant/app/android
        run: ./gradlew --no-daemon bundleRelease assembleDebug
      - name: Publish build files to the pmiq-android-builds branch
        run: |
          OUT=$RUNNER_TEMP/out; mkdir -p "$OUT"
          cp pontimax-assistant/app/android/app/build/outputs/bundle/release/app-release.aab "$OUT/pm-assistant-iq-unsigned.aab"
          cp pontimax-assistant/app/android/app/build/outputs/apk/debug/app-debug.apk "$OUT/pm-assistant-iq-test.apk"
          printf 'version %s\ncommit %s\nbranch %s\nrun %s\n' "$VERSION_LABEL" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > "$OUT/BUILD.txt"
          cd "$OUT" && git init -q -b pmiq-android-builds && git add . \
            && git -c user.name=pmiq-ci -c user.email=pmiq-ci@users.noreply.github.com commit -qm "PM Assistant IQ Android $VERSION_LABEL" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" pmiq-android-builds
