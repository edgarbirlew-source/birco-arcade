name: Android app

# Builds the Android app from the web game. The release bundle is left unsigned here:
# it is signed with the BIRCO upload key outside this public repo before it goes to Play.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: [index.html, sw.js, manifest.webmanifest, 'fonts/**', 'icons/**', 'lib/**', 'app/**', .github/workflows/android.yml]

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

defaults:
  run:
    shell: bash  # fail on errors inside pipes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Make the Android project
        working-directory: app
        run: |
          npm ci
          npm run web
          npx cap add android
          npm run assets -- --android
          npx cap sync android
      - name: Set version
        working-directory: app/android
        run: |
          NAME=$(node -p "require('../package.json').version")
          CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$NAME\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
          echo "VERSION_LABEL=$NAME-$CODE" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app/android
        run: ./gradlew --no-daemon bundleRelease assembleDebug
      - name: Publish build files to the app-builds branch
        run: |
          OUT=$(mktemp -d)
          cp app/android/app/build/outputs/bundle/release/app-release.aab "$OUT/android-release-unsigned.aab"
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "$OUT/android-test.apk"
          printf 'version %s\ncommit %s\nbranch %s\n' "$VERSION_LABEL" "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$OUT/android-build.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin app-builds; then git checkout -B app-builds origin/app-builds; else git checkout --orphan app-builds; git rm -rf --quiet .; fi
          git clean -fdxq -e app/node_modules
          cp "$OUT"/* .
          git add android-release-unsigned.aab android-test.apk android-build.txt
          git commit -m "Android build $VERSION_LABEL from ${GITHUB_SHA::7}"
          git push origin app-builds
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_LABEL }}
          path: |
            app/android/app/build/outputs/bundle/release/app-release.aab
            app/android/app/build/outputs/apk/debug/app-debug.apk
