name: iPhone app

# Builds the iPhone app from the web game on GitHub's Mac.
# With the App Store Connect key secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) it registers the
# bundle ID, and once the App Store Connect app record exists it uploads the build to TestFlight.
# Archive is unsigned (the team has no devices); the export step signs it with an App Store profile.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, sw.js, 'birco/**', manifest.webmanifest, 'fonts/**', 'icons/**', 'lib/**', 'app/**', .github/workflows/ios.yml]

concurrency:
  group: ios-app
  cancel-in-progress: false

defaults:
  run:
    shell: bash  # fail on errors inside pipes

jobs:
  build:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.birco.arcade.drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Make the iPhone project
        working-directory: app
        run: |
          npm ci
          npm run web
          npx cap add ios
          npm run assets -- --ios
          npx cap sync ios
          npm run native -- ios
      - name: Set version
        working-directory: app/ios/App
        run: |
          NAME=$(node -p "require('../../package.json').version")
          CODE=$((100 + ${{ github.run_number }}))
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $NAME;/g; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $CODE;/g; s/TARGETED_DEVICE_FAMILY = [^;]*;/TARGETED_DEVICE_FAMILY = 1;/g" App.xcodeproj/project.pbxproj
          echo "VERSION_LABEL=$NAME ($CODE)" >> "$GITHUB_ENV"
      - name: App Store Connect app record
        id: asc
        if: env.ASC_KEY_ID != ''
        working-directory: pontimax-assistant/app
        run: node scripts/asc.mjs ensure "$BUNDLE_ID" "Blast Buggies"
      - name: Check it compiles (simulator, unsigned)
        if: env.ASC_KEY_ID == '' || steps.asc.outputs.app == 'none'
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
          echo "Compiled only: no App Store Connect app record for $BUNDLE_ID yet."
      - name: Archive and upload to TestFlight
        if: env.ASC_KEY_ID != '' && steps.asc.outputs.app != 'none'
        working-directory: app/ios/App
        run: |
          mkdir -p ~/private_keys
          KEY=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" "${AUTH[@]}" archive | tail -20
          # Vendor frameworks (Google Mobile Ads, UMP) keep their vendor signature in an unsigned archive,
          # which App Store Connect rejects (error 90035). Strip it so the export signs them with our team.
          for F in "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Frameworks/"*.framework; do
            [ -e "$F" ] && codesign --remove-signature "$F" && echo "Unsigned $(basename "$F") for re-signing"
          done
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "Uploaded $VERSION_LABEL to TestFlight."
